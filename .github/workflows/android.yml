name: Android Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5' # Explicitly use this version since we don't have a wrapper

    - name: Make gradlew executable (if present)
      run: chmod +x gradlew || true

    - name: Create local.properties (Dummy)
      run: echo "GEMINI_API_KEY=dummy_key_for_ci" > local.properties

    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Run Unit Tests
      run: gradle testDebugUnitTest --no-daemon
